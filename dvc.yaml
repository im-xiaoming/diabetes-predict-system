stages:
  export_training_data:
    cmd: python -u ml/export_training_data.py --output data/training.csv --fallback data/data.csv
    always_changed: true
    deps:
    - data/data.csv
    - ml/export_training_data.py
    outs:
    - data/training.csv

  train_model:
    cmd: python -u ml/train.py --data data/training.csv --config configs/model_training_config.json
    deps:
    - data/training.csv
    - configs/model_training_config.json
    - ml/preprocessing.py
    - ml/train.py
    - ml/tune.py
    outs:
    - ml/artifacts/model.pkl:
        persist: true
