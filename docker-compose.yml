name: diabetes-predict-system

x-app-env: &app-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-for-real-deployments}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,django}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
  DATABASE_URL: ${DATABASE_URL:-}
  PGHOST: ${PGHOST:-}
  PGDATABASE: ${PGDATABASE:-}
  PGUSER: ${PGUSER:-}
  PGPASSWORD: ${PGPASSWORD:-}
  PGPORT: ${PGPORT:-5432}
  PGSSLMODE: ${PGSSLMODE:-require}
  DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
  SQLITE_PATH: ${SQLITE_PATH:-/app/runtime/db.sqlite3}
  STATIC_ROOT: ${STATIC_ROOT:-/app/staticfiles}
  MODEL_PATH: /app/ml/artifacts/model.pkl
  MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-sqlite:////app/runtime/mlflow.db}
  MLFLOW_ARTIFACT_ROOT: ${MLFLOW_ARTIFACT_ROOT:-/app/mlruns}
  MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-}
  MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD:-}
  DVC_PULL: ${DVC_PULL:-False}
  DVC_REMOTE: ${DVC_REMOTE:-origin}
  DVC_NO_ANALYTICS: ${DVC_NO_ANALYTICS:-True}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  RESET_DATABASE_ON_START: ${RESET_DATABASE_ON_START:-False}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-True}
  RUN_COLLECTSTATIC: ${RUN_COLLECTSTATIC:-False}
  DJANGO_CREATE_SUPERUSER: ${DJANGO_CREATE_SUPERUSER:-False}
  DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
  DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-1}
  DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}

services:
  django:
    build:
      context: .
    image: diabetes-predict-system:latest
    command: django
    environment:
      <<: *app-env
      FASTAPI_BASE_URL: http://api:8001
      MLFLOW_UI_URL: http://127.0.0.1:5001
      MLFLOW_HEALTH_URL: http://mlflow:5000
      MLFLOW_AUTO_START: ${MLFLOW_AUTO_START:-False}
    ports:
      - "8000:8000"
    volumes:
      - ./.runtime:/app/runtime
      - staticfiles:/app/staticfiles
      - mlruns:/app/mlruns
      - ./configs:/app/configs
      - ./ml/artifacts:/app/ml/artifacts
    depends_on:
      - api
      - mlflow

  api:
    image: diabetes-predict-system:latest
    build:
      context: .
    command: api
    environment:
      <<: *app-env
    ports:
      - "8001:8001"
    volumes:
      - ./ml/artifacts:/app/ml/artifacts:ro

  mlflow:
    image: diabetes-predict-system:latest
    build:
      context: .
    command: mlflow
    environment:
      <<: *app-env
    ports:
      - "5000:5000"
    volumes:
      - ./.runtime:/app/runtime
      - mlruns:/app/mlruns

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana-oss:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: frser-sqlite-datasource
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./.runtime:/var/lib/grafana/sqlite:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - django

volumes:
  staticfiles:
  mlruns:
  prometheus_data:
  grafana_data:
