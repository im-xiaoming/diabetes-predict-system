name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  django:
    name: Django and ML checks
    runs-on: windows-latest

    env:
      DJANGO_SETTINGS_MODULE: diabetes_predict_system.settings
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python manage.py test --noinput

      - name: Compile ML modules
        run: python -m py_compile ml\tracking.py ml\tune.py ml\train.py ml\export_training_data.py

  airflow-image:
    name: Airflow image build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Airflow image
        working-directory: airflow
        run: docker compose build
