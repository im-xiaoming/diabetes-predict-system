name: CI/CD

on:
  push:
    branches:
      - main
      - nguong
  pull_request:
    branches:
      - main
      - nguong
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  DJANGO_SECRET_KEY: ci-secret-key
  DJANGO_DEBUG: "False"
  DATABASE_URL: ""
  PGHOST: ""
  SQLITE_PATH: ${{ github.workspace }}/.runtime/ci.sqlite3
  FASTAPI_BASE_URL: http://127.0.0.1:8001
  DVC_PULL: "False"
  DVC_NO_ANALYTICS: "True"
  MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/.runtime/mlflow.db
  MLFLOW_ARTIFACT_ROOT: ${{ github.workspace }}/.runtime/mlruns

jobs:
  ci:
    name: Django and Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl git openjdk-17-jre-headless

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          sed '/^pywin32==/d' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install -r /tmp/requirements-ci.txt

      - name: Prepare runtime folders
        run: mkdir -p .runtime

      - name: Django system check
        run: python manage.py check

      - name: Compile Python modules
        run: |
          python -m compileall \
            accounts alerts api dashboard diabetes_predict_system history logging_app \
            ml mock_his modeling monitor patients predictions \
            -q

      - name: Run Django tests
        run: python manage.py test --noinput

  docker:
    name: Build and optional push Docker image
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: diabetes-predict-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push Docker image to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-predict-system:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-predict-system:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
